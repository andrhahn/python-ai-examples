<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Chat Streaming Example</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f5;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .message {
      max-width: 680px;
      width: 100%;
      line-height: 1.6;
      font-size: 15px;
    }

    .message.user {
      align-self: flex-end;
      background: #1a1a1a;
      color: #fff;
      padding: 10px 16px;
      border-radius: 18px 18px 4px 18px;
    }

    .message.assistant {
      align-self: flex-start;
      color: #1a1a1a;
      white-space: pre-wrap;
    }

    .message.assistant::after {
      content: '▋';
      display: inline-block;
      animation: blink 0.8s step-end infinite;
      margin-left: 1px;
      color: #999;
    }

    .message.assistant.done::after {
      display: none;
    }

    .message.assistant p { margin-bottom: 0.6em; }
    .message.assistant p:last-child { margin-bottom: 0; }
    .message.assistant ul, .message.assistant ol { padding-left: 1.4em; margin-bottom: 0.6em; }
    .message.assistant li { margin-bottom: 0.2em; }
    .message.assistant code { background: #f0f0f0; padding: 1px 5px; border-radius: 4px; font-size: 13px; }
    .message.assistant pre { background: #f0f0f0; padding: 12px; border-radius: 6px; overflow-x: auto; margin-bottom: 0.6em; }
    .message.assistant pre code { background: none; padding: 0; }
    .message.assistant a { color: #0066cc; }

    @keyframes blink {
      50% { opacity: 0; }
    }

    #input-bar {
      display: flex;
      gap: 8px;
      padding: 16px;
      background: #fff;
      border-bottom: 1px solid #e5e5e5;
    }

    #input {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
      font-family: inherit;
    }

    #input:focus { border-color: #aaa; }

    button {
      padding: 10px 20px;
      background: #1a1a1a;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      cursor: pointer;
      font-family: inherit;
    }

    button:disabled { opacity: 0.4; cursor: default; }
  </style>
</head>
<body>

<div id="input-bar">
  <input id="input" type="text" placeholder="Message…" autofocus>
  <button id="send" onclick="sendMessage()">Send</button>
</div>

<div id="chat"></div>

<script>
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('send');

  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });

  function addMessage(text, role) {
    const div = document.createElement('div');
    div.className = `message ${role}`;
    div.textContent = text;
    document.getElementById('chat').appendChild(div);
    div.scrollIntoView({ behavior: 'smooth', block: 'end' });
    return div;
  }

  async function sendMessage() {
    const msg = input.value.trim();
    if (!msg) return;

    input.value = '';
    input.disabled = true;
    sendBtn.disabled = true;

    addMessage(msg, 'user');
    const reply = addMessage('', 'assistant');
    let buffer = '';
    let rawBuffer = '';

    const response = await fetch('http://localhost:8000/chat?message=' + encodeURIComponent(msg), { method: 'POST' });
    const reader = response.body.getReader();
    const decoder = new TextDecoder();

    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      rawBuffer += decoder.decode(value, { stream: true });
      const events = rawBuffer.split('\n\n');
      rawBuffer = events.pop(); // hold incomplete last event for next chunk
      for (const event of events) {
        const dataLines = event.split('\n').filter(l => l.startsWith('data: ')).map(l => l.slice(6));
        if (dataLines.length) {
          buffer += dataLines.join('\n');
          reply.innerHTML = marked.parse(buffer);
          reply.scrollIntoView({ behavior: 'smooth', block: 'end' });
        }
      }
    }

    reply.innerHTML = marked.parse(buffer);
    reply.classList.add('done');
    input.disabled = false;
    sendBtn.disabled = false;
    input.focus();
  }
</script>
</body>
</html>
